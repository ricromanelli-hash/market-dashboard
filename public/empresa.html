<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores · Market Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="emp-page">
  <header class="emp-topo">
    <div>
      <h1 id="empTitulo">Indicadores</h1>
      <p id="empSub" class="emp-sub"></p>
    </div>
    <a class="emp-voltar" href="index.html">← Painel</a>
  </header>
  <nav id="empAbas" class="emp-abas" hidden></nav>
  <!-- combinações salvas de indicadores; valem para qualquer empresa -->
  <div id="empFavs" class="emp-favs" hidden></div>
  <!-- preenchido depois que os dados chegam: os anos das opções saem das próprias linhas -->
  <div id="empControles" class="emp-controles" hidden></div>
  <!-- resultado do arrasto, posicionado onde o botão foi solto -->
  <div id="empBalao" class="emp-balao" hidden></div>
  <!-- histórico do indicador, aberto ao clicar no cabeçalho de uma coluna -->
  <div id="empModal" class="emp-modal" hidden></div>
  <!-- valores do período sob o mouse, dentro do gráfico -->
  <div id="empDica" class="emp-dica-graf" hidden></div>
  <main id="empConteudo">
    <p class="loading">Carregando indicadores…</p>
  </main>
  <script src="empresa.js"></script>
</body>
</html>
